<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imane Laazibi | Computer science engineering student</title>
<meta name="description" content="Portfolio of Imane Laazibi, computer science engineering student (CNAM Grand Est) and Data & BI Engineer at Domial.">
<meta name="theme-color" content="#07080F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2307080F'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%238B7CF6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas class="bg-canvas" id="bgCanvas" aria-hidden="true"></canvas>

<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<nav class="rail" aria-label="Main navigation">
  <a class="logo" href="#home" aria-label="Imane Laazibi">IL</a>
  <div class="railwrap" id="railwrap">
    <ul id="railList">
      <li><a href="#home" data-sec="home"><span class="dot"></span><span class="lab" data-i18n="nav_home"></span></a></li>
      <li><a href="#about" data-sec="about"><span class="dot"></span><span class="lab" data-i18n="nav_about"></span></a></li>
      <li><a href="#skills" data-sec="skills"><span class="dot"></span><span class="lab" data-i18n="nav_skills"></span></a></li>
      <li><a href="#projects" data-sec="projects"><span class="dot"></span><span class="lab" data-i18n="nav_projects"></span></a></li>
      <li><a href="#certs" data-sec="certs"><span class="dot"></span><span class="lab" data-i18n="nav_certs"></span></a></li>
      <li><a href="#contact" data-sec="contact"><span class="dot"></span><span class="lab" data-i18n="nav_contact"></span></a></li>
    </ul>
    <div class="rail-fill" id="railFill"></div>
  </div>
</nav>

<div class="tools">
  <button class="tool" id="langBtn" type="button"></button>
  <button class="tool" id="themeBtn" type="button" data-i18n-aria="theme_aria">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
  </button>
</div>

<main id="main">

  <!-- HOME -->
  <section class="hero" id="home" aria-labelledby="name">
    
    <div class="wrap">
      <p class="query seq" style="--t:.1s" aria-hidden="true"><span class="prompt">&gt;</span> <span id="typed"></span><i class="caret"></i></p>
      <h1 class="name" id="name" aria-label="Imane Laazibi">
        <span class="w" id="w1" aria-hidden="true">Imane</span>
        <span class="w outline" id="w2" aria-hidden="true">Laazibi</span>
      </h1>
      <p class="role seq" style="--t:1.5s" data-i18n="hero_role"></p>
      <p class="intro seq" style="--t:1.65s" data-i18n="hero_intro"></p>
      <p class="status seq" style="--t:1.8s"><i aria-hidden="true"></i><span data-i18n="hero_status"></span></p>
      <div class="cta seq" style="--t:1.95s">
        <a class="btn solid" href="#projects" data-i18n="cta_projects"></a>
        <a class="btn" href="#contact" data-i18n="cta_contact"></a>
      </div>
    </div>
  </section>

  <!-- ABOUT -->
  <section id="about" aria-labelledby="about-title">
    <div class="wrap">
      <h2 class="mask" id="about-title" data-reveal-mask><span data-i18n="about_title"></span></h2>
      <div class="about-grid">
        <div data-reveal="left">
          <p data-i18n="about_p1"></p>
          <p data-i18n="about_p2"></p>
        </div>
        <ul class="facts" id="facts" data-reveal="right"></ul>
      </div>
      <h3 class="sub" data-reveal="up" data-i18n="tl_title"></h3>
      <div class="tl" id="tl"></div>
    </div>
  </section>

  <!-- SKILLS -->
  <section id="skills" aria-labelledby="skills-title">
    <div class="wrap">
      <h2 class="mask" id="skills-title" data-reveal-mask><span data-i18n="skills_title"></span></h2>
      <div id="skillList"></div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section id="projects" aria-labelledby="projects-title">
    <div class="wrap">
      <div class="proj-head">
        <h2 class="mask" id="projects-title" data-reveal-mask><span data-i18n="projects_title"></span></h2>
        <div class="ctrl" data-reveal="up">
          <button class="arrow" id="prev" type="button" data-i18n-aria="prev_aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span class="count" id="count" aria-live="polite"></span>
          <button class="arrow" id="next" type="button" data-i18n-aria="next_aria"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
      </div>
      <div class="track" id="track" role="list" data-reveal="scale"></div>
    </div>
  </section>

  <!-- CERTIFICATIONS -->
  <section id="certs" aria-labelledby="certs-title">
    <div class="wrap">
      <h2 class="mask" id="certs-title" data-reveal-mask><span data-i18n="certs_title"></span></h2>
      <p class="circuit-hint" data-i18n="circuit_hint"></p>
      <div class="circuit" id="circuit" data-reveal="up">
        <svg class="wires" id="wires" aria-hidden="true"></svg>
        <div id="circNodes"></div>
        <div class="cert-pop" id="certPop" aria-live="polite" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <!-- CONTACT -->
  <section id="contact" aria-labelledby="contact-title">
    <div class="wrap">
      <h2 class="mask" id="contact-title" data-reveal-mask><span data-i18n="contact_title"></span></h2>
      <div class="contact-grid">
        <div data-reveal="left">
          <p data-i18n="contact_intro"></p>
          <a class="mail" href="mailto:laazibiimane101@gmail.com">laazibiimane101@gmail.com</a>
          <ul class="links" id="links"></ul>
        </div>
        <form id="form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" data-reveal="right">
          <input type="hidden" name="form-name" value="contact">
          <p class="hp" aria-hidden="true"><label>Leave empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
          <div class="field"><label for="f-name" data-i18n="f_name"></label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="f-email" data-i18n="f_email"></label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="f-msg" data-i18n="f_msg"></label><textarea id="f-msg" name="message" rows="5" required></textarea></div>
          <div><button class="btn solid" id="send" type="submit" data-i18n="f_send"></button></div>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
</main>



<!-- Project details window -->
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>

<!-- Full-size screenshot viewer -->
<dialog id="lb" class="lb" aria-label="Screenshot"></dialog>

<noscript><p style="position:fixed;bottom:0;left:0;right:0;padding:12px;background:#141A3A;color:#fff;text-align:center">This portfolio needs JavaScript to display its content.</p></noscript>

</body>
</html>
